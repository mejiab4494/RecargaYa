<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" role="img" aria-label="Gift card wrapped with a ribbon and bow" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="480" height="200" rx="16" fill="#F0FDF4"/>
  <circle cx="50" cy="165" r="75" fill="#DCFCE7"/>
  <circle cx="440" cy="30" r="70" fill="#DCFCE7"/>

  <g transform="rotate(-6 240 110)">
    <!-- card -->
    <rect x="140" y="48" width="200" height="130" rx="14" fill="#2563EB"/>
    <rect x="156" y="144" width="56" height="7" rx="3.5" fill="#fff" opacity="0.85"/>
    <rect x="156" y="158" width="36" height="7" rx="3.5" fill="#fff" opacity="0.5"/>
    <!-- ribbon -->
    <rect x="228" y="48" width="24" height="130" fill="#FBBF24"/>
    <rect x="140" y="96" width="200" height="24" fill="#FBBF24"/>
    <!-- bow -->
    <path d="M240 48 C200 4 178 46 240 48Z" fill="#FBBF24" stroke="#0F2A5C" stroke-width="4" stroke-linejoin="round"/>
    <path d="M240 48 C280 4 302 46 240 48Z" fill="#FBBF24" stroke="#0F2A5C" stroke-width="4" stroke-linejoin="round"/>
    <circle cx="240" cy="50" r="9" fill="#0F2A5C"/>
  </g>

  <!-- sparkles -->
  <path d="M95 60 q0 14 14 14 q-14 0 -14 14 q0 -14 -14 -14 q14 0 14 -14z" fill="#FBBF24"/>
  <path d="M392 70 q0 11 11 11 q-11 0 -11 11 q0 -11 -11 -11 q11 0 11 -11z" fill="#2563EB"/>
  <path d="M385 150 q0 9 9 9 q-9 0 -9 9 q0 -9 -9 -9 q9 0 9 -9z" fill="#FBBF24"/>
  <circle cx="108" cy="150" r="5" fill="#2563EB"/>
  <circle cx="430" cy="115" r="4" fill="#FBBF24"/>
</svg>
