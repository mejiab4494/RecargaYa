<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" role="img" aria-label="Phone with a lightning bolt and coins" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="480" height="200" rx="16" fill="#EFF6FF"/>
  <circle cx="60" cy="40" r="70" fill="#DBEAFE"/>
  <circle cx="440" cy="170" r="80" fill="#DBEAFE"/>

  <!-- signal arcs -->
  <g fill="none" stroke="#2563EB" stroke-width="6" stroke-linecap="round">
    <path d="M309 83 A24 24 0 0 1 309 117"/>
    <path d="M320 72 A40 40 0 0 1 320 128" opacity="0.65"/>
    <path d="M332 60 A56 56 0 0 1 332 140" opacity="0.35"/>
  </g>

  <!-- phone -->
  <rect x="195" y="16" width="90" height="168" rx="16" fill="#0F2A5C"/>
  <rect x="203" y="32" width="74" height="136" rx="8" fill="#DBEAFE"/>
  <rect x="226" y="21" width="28" height="5" rx="2.5" fill="#2563EB"/>
  <circle cx="240" cy="84" r="26" fill="#FBBF24"/>
  <polygon points="247,66 230,89 240,89 234,106 252,81 242,81" fill="#0F2A5C"/>
  <rect x="213" y="126" width="54" height="16" rx="8" fill="#2563EB"/>
  <rect x="222" y="150" width="36" height="5" rx="2.5" fill="#93C5FD"/>

  <!-- coins -->
