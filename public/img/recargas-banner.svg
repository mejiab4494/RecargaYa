  <!-- sparkles -->
  <path d="M390 40 q0 10 10 10 q-10 0 -10 10 q0 -10 -10 -10 q10 0 10 -10z" fill="#FBBF24"/>
  <circle cx="420" cy="100" r="5" fill="#2563EB"/>
  <circle cx="165" cy="48" r="5" fill="#2563EB"/>
</svg>
